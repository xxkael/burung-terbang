<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fly Birds - Pro Leaderboard</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        canvas { display: block; width: 100vw; height: 100vh; }
        
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; display: flex; align-items: center; justify-content: center; }
        .window { background: rgba(0,0,0,0.95); padding: 20px; border-radius: 15px; text-align: center; color: white; border: 4px solid #fff; width: 290px; display: none; pointer-events: auto; }
        .active { display: block !important; }

        .btn { padding: 12px; margin: 8px 0; background: #27ae60; color: white; border: 3px solid #fff; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; }
        .btn-blue { background: #3498db; }
        .btn-red { background: #e74c3c; }
        .btn-small { padding: 8px; font-size: 11px; margin: 4px 2px; flex: 1; border: 2px solid #fff; }
        .active-music { background: #f1c40f !important; color: #000 !important; }
        
        input { padding: 10px; border-radius: 5px; border: none; margin-bottom: 8px; width: 90%; text-align: center; color: #000; font-weight: bold; }
        
        .skin-item { background: none; border: 4px solid transparent; border-radius: 10px; padding: 5px; cursor: pointer; }
        .skin-active { border-color: #ff9800 !important; background: rgba(255, 152, 0, 0.2); }

        #leaderboard { margin-top: 10px; background: rgba(255,255,255,0.1); padding: 8px; border-radius: 8px; font-size: 11px; }
        .lb-row { display: flex; justify-content: space-between; border-bottom: 1px solid #444; padding: 6px 0; align-items: center; }
        .lb-name { flex: 1; text-align: left; font-weight: bold; }
        .lb-diff { font-size: 9px; padding: 2px 4px; border-radius: 4px; margin: 0 5px; text-transform: uppercase; color: #fff; }
        .diff-easy { background: #2ecc71; }
        .diff-medium { background: #f1c40f; color: #000; }
        .diff-hard { background: #e74c3c; }
        .lb-score { color: #f1c40f; font-weight: bold; min-width: 30px; text-align: right; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="main-menu" class="window active">
            <h1 style="color:#f1c40f; margin:10px 0;">FLY BIRDS</h1>
            <p id="user-display" style="font-size:14px; color:#3498db; font-weight:bold;">Guest Mode</p>
            <button class="btn" onclick="checkAuthAndStart()">PLAY GAME</button>
            <button class="btn btn-blue" onclick="openWindow('diff-menu')">DIFFICULTY</button>
            <button class="btn btn-blue" onclick="openWindow('skin-menu')">SKINS</button>
            <button class="btn btn-blue" onclick="openWindow('setting-menu')">ACCOUNT & MUSIC</button>
            <div id="leaderboard">
                <b>🏆 TOP RECORDS 🏆</b>
                <div id="lb-content"></div>
            </div>
        </div>

        <div id="setting-menu" class="window">
            <h3>ACCOUNT</h3>
            <input type="text" id="reg-user" placeholder="USERNAME">
            <input type="password" id="reg-pass" placeholder="PASSWORD">
            <div style="display:flex; gap:5px;">
                <button class="btn btn-small" onclick="handleAuth('login')">LOGIN</button>
                <button class="btn btn-small btn-blue" onclick="handleAuth('reg')">DAFTAR</button>
            </div>
            <hr>
            <h3>PLAYLIST</h3>
            <button id="m1" class="btn btn-small btn-blue active-music" onclick="selectMusic('musik.mp3', 'm1')">Gemu Fa Mi Re</button>
            <button id="m2" class="btn btn-small btn-blue" onclick="selectMusic('elitis_loh_ya.mp3', 'm2')">Kutetap Menanti</button>
            <button id="m-off" class="btn btn-small btn-red" onclick="selectMusic('none', 'm-off')">MUSIC: OFF</button>
            <button class="btn btn-red" onclick="openWindow('main-menu')" style="margin-top:10px;">BACK</button>
        </div>

        <div id="diff-menu" class="window">
            <h3>DIFFICULTY</h3>
            <button id="d-easy" class="btn" onclick="setDiff('easy')" style="background:#2ecc71">EASY</button>
            <button id="d-medium" class="btn" onclick="setDiff('medium')" style="background:#f1c40f; color:black">MEDIUM</button>
            <button id="d-hard" class="btn" onclick="setDiff('hard')" style="background:#e74c3c">HARD</button>
            <button class="btn btn-red" onclick="openWindow('main-menu')">BACK</button>
        </div>

        <div id="skin-menu" class="window">
            <h3>SKINS</h3>
            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-bottom:10px;">
                <button id="skin-ojan" onclick="selectSkin(1, 'ojan_v1.jpg', 'skin-ojan')" class="skin-item"><img src="ojan_v1.jpg" width="50" height="50"><p style="font-size:8px; color:white; margin:2px 0;">OJAN</p></button>
                <button id="skin-dara" onclick="selectSkin(2, 'dara.jpg', 'skin-dara')" class="skin-item"><img src="dara.jpg" width="50" height="50"><p style="font-size:8px; color:white; margin:2px 0;">DARA</p></button>
                <button id="skin-bahlil" onclick="selectSkin(3, 'bahlilV1.jpg', 'skin-bahlil')" class="skin-item"><img src="bahlilV1.jpg" width="50" height="50"><p style="font-size:8px; color:white; margin:2px 0;">BAHLIL</p></button>
                <button id="skin-burcil" onclick="selectSkin(4, 'burcil.png', 'skin-burcil')" class="skin-item"><img src="burcil.png" width="50" height="50"><p style="font-size:8px; color:white; margin:2px 0;">BURCIL</p></button>
            </div>
            <button class="btn btn-red" onclick="openWindow('main-menu')">BACK</button>
        </div>
    </div>

    <div id="game-over-screen" style="position:absolute; width:100%; height:100%; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); z-index:200; color:white; pointer-events:auto;">
        <h2 style="font-size:40px; color:#e74c3c; margin:0;">GAME OVER</h2>
        <p id="final-score-text" style="font-size:24px;">Skor: 0</p>
        <p id="final-diff-text" style="font-size:14px; color:#f1c40f;"></p>
        <button class="btn btn-red" style="width:200px" onclick="restartGame()">RESTART</button>
    </div>

    <canvas id="gameCanvas"></canvas>
    <audio id="bgMusic" loop></audio>
    <audio id="dieSound"><source src="2detik.mp3" type="audio/mpeg"></audio>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const audio = document.getElementById("bgMusic");
    const dieSound = document.getElementById("dieSound");
    
    let accounts = JSON.parse(localStorage.getItem("game_accounts")) || {};
    let currentUser = localStorage.getItem("current_session") || null;

    const imgBg = new Image(); imgBg.src = "background.jpg";
    const imgPipe = new Image(); imgPipe.src = "tiang.png";
    const imgBird = new Image();
    
    let currentSkinID = parseInt(localStorage.getItem("last_skin_id_num")) || 1;
    let lastSkinFile = localStorage.getItem("last_skin_file") || "ojan_v1.jpg";
    let lastSkinBtnId = localStorage.getItem("last_skin_btn_id") || "skin-ojan";
    imgBird.src = lastSkinFile;

    let selectedTrack = 'musik.mp3';
    let gameState = "MENU";
    let score = 0; let bgX = 0; let frame = 0; let pipes = [];
    let bird = { x: 50, y: 0, w: 40, h: 40, vel: 0 };
    let diff = localStorage.getItem("last_diff") || 'easy';
    let floorH = 100;

    const configs = {
        easy: { g: 0.4, j: -7, s: 3.2, gap: 240, spawn: 110 },
        medium: { g: 0.52, j: -9, s: 5.2, gap: 200, spawn: 85 },
        hard: { g: 0.65, j: -10, s: 7.2, gap: 170, spawn: 70 }
    };

    function checkSession() {
        if(currentUser) {
            document.getElementById('user-display').innerText = "Logged in: " + currentUser;
            document.getElementById('user-display').style.color = "#2ecc71";
        }
        updateLB();
        document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('skin-active'));
        if(document.getElementById(lastSkinBtnId)) document.getElementById(lastSkinBtnId).classList.add('skin-active');
    }

    function handleAuth(type) {
        let u = document.getElementById('reg-user').value.trim().toLowerCase();
        let p = document.getElementById('reg-pass').value.trim();
        if(!u || !p) return;
        if(type === 'reg') {
            if(accounts[u]) alert("Username ada!");
            else {
                accounts[u] = { password: p, highscore: 0, h_diff: 'easy' };
                localStorage.setItem("game_accounts", JSON.stringify(accounts));
                alert("Berhasil Daftar!");
            }
        } else {
            if(accounts[u] && accounts[u].password === p) {
                currentUser = u;
                localStorage.setItem("current_session", u);
                checkSession();
                openWindow('main-menu');
            } else alert("Salah!");
        }
    }

    function openWindow(id) {
        document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        checkSession();
    }

    function selectMusic(f, id) {
        selectedTrack = f;
        document.querySelectorAll('#setting-menu .btn-small').forEach(b => b.classList.remove('active-music'));
        document.getElementById(id).classList.add('active-music');
    }

    function checkAuthAndStart() {
        if(!currentUser) openWindow('setting-menu');
        else startGame();
    }

    function startGame() {
        gameState = "PLAYING";
        document.getElementById('ui-layer').style.display = 'none';
        document.getElementById('game-over-screen').style.display = 'none';
        score = 0; pipes = []; frame = 0; bird.y = canvas.height / 3; bird.vel = 0;
        imgBird.src = lastSkinFile;
        if(selectedTrack !== 'none') { audio.src = selectedTrack; audio.play(); }
    }

    function restartGame() {
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('ui-layer').style.display = 'flex';
        openWindow('main-menu');
    }

    function gameOver() {
        if(gameState === "DEAD") return;
        gameState = "DEAD";
        audio.pause();
        dieSound.currentTime = 0; dieSound.play();
        setTimeout(() => dieSound.pause(), 2350);

        // Simpan skor + difficulty
        if(currentUser) {
            if(!accounts[currentUser].h_diff) accounts[currentUser].h_diff = 'easy';
            if(score > accounts[currentUser].highscore) {
                accounts[currentUser].highscore = score;
                accounts[currentUser].h_diff = diff;
                localStorage.setItem("game_accounts", JSON.stringify(accounts));
            }
        }

        document.getElementById('final-score-text').innerText = "Skor: " + score;
        document.getElementById('final-diff-text').innerText = "Mode: " + diff.toUpperCase();
        setTimeout(() => { document.getElementById('game-over-screen').style.display = 'flex'; }, 800);
    }

    function selectSkin(idNum, file, btnId) { 
        currentSkinID = idNum; lastSkinFile = file; lastSkinBtnId = btnId;
        imgBird.src = file; 
        localStorage.setItem("last_skin_id_num", idNum);
        localStorage.setItem("last_skin_file", file);
        localStorage.setItem("last_skin_btn_id", btnId);
        document.querySelectorAll('.skin-item').forEach(el => el.classList.remove('skin-active'));
        document.getElementById(btnId).classList.add('skin-active');
    }
    
    function setDiff(m) { 
        diff = m; 
        localStorage.setItem("last_diff", m);
        openWindow('main-menu'); 
    }

    function updateLB() {
        let list = Object.keys(accounts).map(k => ({
            n: k, 
            s: accounts[k].highscore, 
            d: accounts[k].h_diff || 'easy'
        })).sort((a,b) => b.s - a.s);
        
        let html = list.slice(0, 5).map((item, i) => `
            <div class="lb-row">
                <span class="lb-name">${i+1}. ${item.n}</span>
                <span class="lb-diff diff-${item.d}">${item.d}</span>
                <span class="lb-score">${item.s}</span>
            </div>
        `).join('');
        document.getElementById('lb-content').innerHTML = html || "No Data";
    }

    window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    
    window.addEventListener('touchstart', (e) => { 
        if(gameState === "PLAYING") { bird.vel = configs[diff].j; e.preventDefault(); }
    }, {passive: false});

    function loop() {
        ctx.drawImage(imgBg, bgX, 0, canvas.width, canvas.height);
        ctx.drawImage(imgBg, bgX + canvas.width, 0, canvas.width, canvas.height);
        
        if(gameState === "PLAYING" || gameState === "DEAD") {
            if(gameState === "PLAYING") {
                bgX -= 2; if(bgX <= -canvas.width) bgX = 0;
                
                if(score >= 10) {
                    if(currentSkinID === 1 && !imgBird.src.includes("otot.png")) imgBird.src = "otot.png";
                    if(currentSkinID === 2 && !imgBird.src.includes("daraV2.jpg")) imgBird.src = "daraV2.jpg";
                    if(currentSkinID === 3 && !imgBird.src.includes("bahlilV2.jpg")) imgBird.src = "bahlilV2.jpg";
                    if(currentSkinID === 4 && !imgBird.src.includes("burged(1).png")) imgBird.src = "burged(1).png";
                }

                if(frame % configs[diff].spawn === 0) {
                    let h = Math.random() * (canvas.height - floorH - configs[diff].gap - 120) + 60;
                    pipes.push({ x: canvas.width, y: h, gap: configs[diff].gap, w: 65, passed: false });
                }
            }

            bird.vel += configs[diff].g; bird.y += bird.vel;

            if(bird.y + bird.h >= canvas.height - floorH) {
                bird.y = canvas.height - floorH - bird.h;
                if(gameState === "PLAYING") gameOver();
            }

            pipes.forEach((p, i) => {
                if(gameState === "PLAYING") p.x -= configs[diff].s;
                ctx.save(); ctx.translate(p.x + p.w, p.y); ctx.rotate(Math.PI);
                ctx.drawImage(imgPipe, 0, 0, p.w, p.y); ctx.restore();
                ctx.drawImage(imgPipe, p.x, p.y + p.gap, p.w, (canvas.height - floorH) - (p.y + p.gap));

                if(gameState === "PLAYING") {
                    if(bird.x+30 > p.x && bird.x+10 < p.x+p.w) {
                        if(bird.y+10 < p.y || bird.y+30 > p.y+p.gap) gameOver();
                    }
                    if(!p.passed && bird.x > p.x + p.w) { score++; p.passed = true; }
                }
                if(p.x + p.w < -100) pipes.splice(i, 1);
            });

            ctx.drawImage(imgBird, bird.x, bird.y, bird.w, bird.h);
            
            if(gameState === "DEAD") {
                ctx.font = "35px Arial";
                ctx.textAlign = "center";
                ctx.fillText("💀", bird.x + bird.w/2, bird.y + 32); 
            }
            
            ctx.fillStyle = "white"; ctx.font = "bold 45px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(score, canvas.width/2, 80);
            frame++;
        }
        requestAnimationFrame(loop);
    }
    
    checkSession();
    loop();
</script>
</body>
</html>
